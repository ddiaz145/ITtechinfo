<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Diaz – Help Desk Projects</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1f4037, #99f2c8);
      color: #f0f0f0;
      text-shadow: 0 0 3px rgba(0,0,0,0.7);
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
      background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
    }

    h1 {
      font-size: 3em;
      font-weight: 900;
      color: #e0e0e0;
    }

    nav {
      background: rgba(15,32,39,0.95);
      text-align: center;
      padding: 12px 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav a {
      margin: 0 25px;
      color: #99f2c8;
      font-weight: bold;
      text-decoration: none;
      font-size: 18px;
    }

    nav a:hover {
      color: #d1ffd6;
      text-decoration: underline;
    }

    section {
      padding: 50px 20px;
      text-align: center;
    }

    section h2 {
      font-size: 2.4em;
      font-weight: 900;
      color: #a3f7bf;
      margin-bottom: 40px;
    }

    section h3 {
      font-size: 1.6em;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .carousel-wrapper {
      max-width: 900px;
      margin: 0 auto 60px;
      overflow: hidden;
      position: relative;
    }

    .carousel-track {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-slide {
      display: flex;
      gap: 25px;
      flex-shrink: 0;
      width: 100%;
      padding: 10px;
      justify-content: center;
    }

    .card {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 30px;
      width: 320px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      flex-shrink: 0;
    }

    .card h3 {
      font-size: 1.2em;
      color: #00cc77;
      margin-bottom: 12px;
    }

    .card p {
      font-size: 1.05em;
      line-height: 1.5;
      color: #e0f7f4;
    }

    .card a {
      display: inline-block;
      margin-top: 12px;
      color: #99f2c8;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.05em;
    }

    .card a:hover {
      color: #d1ffd6;
      text-decoration: underline;
    }

    .carousel-buttons {
      position: absolute;
      top: 50%;
      width: 100%;
      pointer-events: none;
    }

    .carousel-buttons button {
      pointer-events: auto;
      position: absolute;
      background: #000;
      color: #fff;
      border: none;
      padding: 12px 36px;
      border-radius: 4px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      transform: translateY(-50%);
    }

    .carousel-buttons button:hover {
      background: #444;
    }

    .carousel-buttons .prev {
      left: 0;
    }

    .carousel-buttons .next {
      right: 0;
    }

    @media (max-width: 768px) {
      .card {
        width: 95%;
      }

      .carousel-slide {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>David Diaz – Help Desk Projects</h1>
  </header>

  <nav>
    <a href="index.html#bio">About Me</a>
    <a href="projects.html">Projects</a>
  </nav>

  <section>
    <h2>Help Desk Projects</h2>

    <!-- Completed Projects -->
    <h3>Help Desk Projects</h3>
    <div class="carousel-wrapper">
      <div class="carousel-track" id="carouselTrack1"></div>
      <div class="carousel-buttons">
        <button class="prev" id="prevBtn1">Prev</button>
        <button class="next" id="nextBtn1">Next</button>
      </div>
    </div>

    <!-- Upcoming Projects -->
    <h3>Internship/Network Engineering Projects</h3>
    <div class="carousel-wrapper">
      <div class="carousel-track" id="carouselTrack2"></div>
      <div class="carousel-buttons">
        <button class="prev" id="prevBtn2">Prev</button>
        <button class="next" id="nextBtn2">Next</button>
      </div>
    </div>
  </section>

  <script>
    const firstCarouselProjects = [
      {
        title: "Active Directory Startup",
        desc: "Created an AD environment with one domain controller and two Windows PCs joined to the domain. RSAT installed for remote management.",
        pdf: "Active%20Directory%20Startup.pdf"
      },
      {
        title: "On-Boarding A New Member",
        desc: "Used Active Directory to onboard a new team member into Sales. Included account creation, Outlook setup, and access verification.",
        pdf: "On-Boarding%20A%20New%20Member.pdf"
      },
      {
        title: "Real World Ticket Account/Password Reset",
        desc: "Resolved a ticket for a locked-out user. Unlocked the account, reset password, and ensured login success with required password update.",
        pdf: "Real%20World%20Tickets%20Account_Password%20Reset.pdf"
      },
      {
        title: "Folder Permissions",
        desc: "Created Sales and Engineering folders with NTFS permissions to control department-level access securely.",
        pdf: "Folder%20Permissions.pdf"
      },
      {
        title: "Remote Desktop Protocol Configuration",
        desc: "Used Group Policy in AD to enable RDP on domain-joined PCs. Verified RDP functionality after deployment.",
        pdf: "RDP.pdf"
      },
      {
        title: "Coming Soon....",
        desc: "Coming Soon...",
        pdf: "Hardware-Diagnostics.pdf"
      }
    ];

    const secondCarouselProjects = [
      {
        title: "End-to-End Network Design",
        desc: "Designed and documented a secure, scalable network infrastructure for a 25–30 person company across Engineering, NetOps, and SecOps. The solution included VLAN and IP addressing plans, device configs, ACLs, and a network diagram to support segmented traffic, remote access, and business-aligned connectivity.",
        pdf: "#"
      },
      {
        title: "Placeholder Project 2",
        desc: "Details about this upcoming project will be available in the near future.",
        pdf: "#"
      },
      {
        title: "Placeholder Project 3",
        desc: "Reserved for a new project in progress. More info will be added shortly.",
        pdf: "#"
      },
      {
        title: "Placeholder Project 4",
        desc: "Coming soon: A hands-on task to expand help desk and networking experience.",
        pdf: "#"
      }
    ];

    const cardsPerSlide = 2;

    function createSlides(trackId, projectList) {
      const track = document.getElementById(trackId);
      const totalSlides = Math.ceil(projectList.length / cardsPerSlide);

      for (let i = 0; i < totalSlides; i++) {
        const slide = document.createElement("div");
        slide.className = "carousel-slide";

        for (let j = i * cardsPerSlide; j < (i + 1) * cardsPerSlide && j < projectList.length; j++) {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <h3>${projectList[j].title}</h3>
            <p>${projectList[j].desc}</p>
            <a href="${projectList[j].pdf}" target="_blank">View PDF</a>
          `;
          slide.appendChild(card);
        }

        track.appendChild(slide);
      }
    }

    function setupCarousel(trackId, prevBtnId, nextBtnId) {
      let index = 0;
      const track = document.getElementById(trackId);
      const totalSlides = track.children.length;

      function updateCarousel() {
        const wrapper = track.parentElement;
        const slideWidth = wrapper.offsetWidth;
        track.style.transform = `translateX(-${index * slideWidth}px)`;
      }

      document.getElementById(prevBtnId).addEventListener("click", () => {
        index = (index - 1 + totalSlides) % totalSlides;
        updateCarousel();
      });

      document.getElementById(nextBtnId).addEventListener("click", () => {
        index = (index + 1) % totalSlides;
        updateCarousel();
      });

      window.addEventListener("resize", updateCarousel);
      updateCarousel();
    }

    createSlides("carouselTrack1", firstCarouselProjects);
    createSlides("carouselTrack2", secondCarouselProjects);
    setupCarousel("carouselTrack1", "prevBtn1", "nextBtn1");
    setupCarousel("carouselTrack2", "prevBtn2", "nextBtn2");
  </script>
</body>
</html>
